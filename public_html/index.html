<html lang="en-GB">
    <head>
        <title>Contact Organizer</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
        <script src="https://kit.fontawesome.com/7967e81f77.js" crossorigin="anonymous"></script>
       
       <style>
            #form,#updateForm, #deleteForm {
                display: none;
            }
            .displayContacts {
               border: solid 3px rgb(59, 159, 179);
               text-align: center;
               margin: 4% auto;
            }
            .displayContacts th {
                background-color: rgb(59, 159, 179);
                color: white;
            }
            .displayContacts td {
                border: solid 1px rgb(59, 159, 179);
            }

            .displayContacts button {
                background-color: transparent;
                color: rgb(59, 159, 179);
                border: none;
                padding: 5px;
                border-radius: 5px;
            }

            .contacts {
                text-align: center;
                margin: 4% auto;
            }
            
            .contacts input{
                text-align: center;
                border: solid rgb(59, 159, 179);
                border-radius: 6px;
                background-color: rgb(59, 159, 179);
                color: white;
                margin: 1%;
            }

            .contacts input:hover {
                background-color: white;
                color: rgb(59, 159, 179);
                cursor: pointer;
            }

            .contactForms form input{
                margin: 1% auto;
                border: solid rgb(59, 159, 179);
                border-radius: 6px;
            }

            .contactForms form input[type="button"] {
                background-color: rgb(59, 159, 179);
                color: white;
            }

            .infoSpan {
                color: red;
            }
            .fa-solid {
                font-size: 1.0em;
                color:  rgb(59, 159, 179);
                font-weight: bold;
            }
        </style>
    </head>
    <body>
<div class="container">

        <div class="contacts">

    <input type="button" value="Add Contact" id="addContactDisplay">
    <input type="button" value="Update Contact" id="updateContactDisplay">
    <input type="button" value="Delete Contact" id="deleteContactDisplay">
    <a href="documentation.html" title="link to the documentation">
        <i class="fa-solid fa-book"> User Docs</i>
        
    </a>
</div>
    
        <!-- add contact details -->
        <div class="contactForms">
            
            <form id="form">
                <label for="name">Name:</label><br>
                <input type="text" id="name" name="name" required><br>
                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email" required><br>
                <label for="phone" >Phone:</label><br>
                <input type="number" id="phone" name="phone" required><br><br>
                <input type="button" value="Add Contact" id="addContact">
                <span class="infoSpan" id="addSpan"></span>
            </form>
        </div>
        <!-- update contact details -->
        <div class="contactForms">
           
            <form id="updateForm">
                <label for="email">Email:</label><br>
                <input type="text" id="email3" name="email" title="updateContact"><br><br>
                <input type="button" value="Update Contact" id="updateContact">
                <span class="infoSpan" id="updateSpan"></span>
            </form>
        </div>
        <!-- delete contact details -->
        <div class="contactForms">
            
            <form id="deleteForm">
                <label for="email">Email:</label><br>
                <input type="text" id="email4" name="email" title="deleteContact"><br><br>
                <input type="button" value="Delete Contact" id="deleteContact">
                <span class="infoSpan" id="deleteSpan"></span>
            </form>
        </div>
        

    <!-- Display all contacts -->

    <table class="table table-striped displayContacts">
        <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
            </tr>
        </thead>
        <tbody id="contactTable"></tbody>
          
    </table>
</div>
        <script>           
            // display all contacts
          function displayContacts() {
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key === "loglevel") {
                    continue;
                }
                const data = JSON.parse(localStorage.getItem(key));
                console.log(data);
                contactTable.innerHTML += `<tr><td>${data.name}</td><td>${data.email}</td><td>${data.phone}</td><td><button type="submit" onclick=edit(this)><i class="fa-solid fa-pen-to-square"></i></button> <button type="submit" onclick= deleteTable(this) ><i class="fa-solid fa-trash"></i></button></td> </tr>`;
               }
    
        }
           
        displayContacts();

        // edit contact details
        function edit(td) {
            selectedRow = td.parentElement.parentElement;
           document.getElementById("name").value = selectedRow.cells[0].innerHTML;
           const email = document.getElementById("email").value = selectedRow.cells[1].innerHTML;
           document.getElementById("phone").value = selectedRow.cells[2].innerHTML;
            const data = JSON.parse(localStorage.getItem(email));
                const name = prompt("Enter new name", data.name);
                const phone = prompt("Enter new phone", data.phone);
                const newData = {name, email, phone};
                localStorage.setItem(email, JSON.stringify(newData));
                location.reload();
        }
            // delete contact details
            function deleteTable(td) {
                
                if (confirm("Are you sure you want to delete this contact?")) {
                    row = td.parentElement.parentElement;
                    const tableDel = document.getElementById("contactTable");
                    const email= row.cells[1].innerHTML;
                    localStorage.removeItem(email);
                   location.reload();
        
                }
            }

            
            // display add contact form
            document.getElementById("addContactDisplay").addEventListener("click", function(){
                document.getElementById("form").style.display = "block";
                document.getElementById("updateForm").style.display = "none";
                document.getElementById("deleteForm").style.display = "none";  
                             
            });
        
            // display update contact form
            document.getElementById("updateContactDisplay").addEventListener("click", function(){
                document.getElementById("updateForm").style.display = "block";
                document.getElementById("form").style.display = "none";
                document.getElementById("deleteForm").style.display = "none";
                
            });
            // display delete contact form
            document.getElementById("deleteContactDisplay").addEventListener("click", function(){
                document.getElementById("deleteForm").style.display = "block";
                document.getElementById("form").style.display = "none";
                document.getElementById("updateForm").style.display = "none";
            });

            // add contact details to local storage
                document.getElementById("addContact").addEventListener("click", function(e){
                e.preventDefault();

                const name = document.getElementById("name").value;
                const email = document.getElementById("email").value;
                const phone = document.getElementById("phone").value;
                const data = {name, email, phone};
                if (name === "" || email === "" || phone === "") {
                    document.getElementById("addSpan").innerHTML = "Please fill in all fields";
                   setInterval(function(){
                    document.getElementById("addSpan").innerHTML = "";
                   }, 2000);
                }
                else {
                        if (!localStorage.getItem(email)) {
                            localStorage.setItem(email, JSON.stringify(data));
                        document.getElementById("form").reset();
                        location.reload();
                        }
                        else {
                            document.getElementById("addSpan").innerHTML = "Contact already exists";
                            setInterval(function(){
                                document.getElementById("addSpan").innerHTML = "";
                            }, 2000);
                        }
            }
            });


            // search for a specific contact using the email and update it
            const updateContact = document.getElementById("updateContact");
            updateContact.addEventListener("click", function(e){
                e.preventDefault();
                const email = document.getElementById("email3").value;
                const data = JSON.parse(localStorage.getItem(email));
                if (data) {
                    const name = prompt("Enter new name", data.name);
                    const phone = prompt("Enter new phone", data.phone);
                    const newData = {name, email, phone};
                    localStorage.setItem(email, JSON.stringify(newData));
                    document.getElementById("updateForm").reset();
                    location.reload();
                }
                else {
                    document.getElementById("updateSpan").innerHTML = "Contact not found";
                    setInterval(function(){
                        document.getElementById("updateSpan").innerHTML = "";
                    }, 2000);
                }
            });

            // search for a specific contact using the emaila and delete it
            const deleteContact = document.getElementById("deleteContact");
            deleteContact.addEventListener("click", function(e){
                e.preventDefault();
                const email = document.getElementById("email4").value;
                const data = JSON.parse(localStorage.getItem(email));
                if (data) {
                    localStorage.removeItem(email);
                    document.getElementById("deleteForm").reset();
                    location.reload();
                }
                else {
                    document.getElementById("deleteSpan").innerHTML = "Contact not found";
                    setInterval(function(){
                        document.getElementById("deleteSpan").innerHTML = "";
                    }, 2000);
                }
            });
        </script>
    </body>
</html>
